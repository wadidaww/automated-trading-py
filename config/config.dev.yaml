opend:
  host: "127.0.0.1"
  port: 11111
  heartbeat_interval_s: 10
  reconnect_max_attempts: 5
  rate_limit_requests: 300
  rate_limit_window_s: 30
trading:
  account_id: "${FUTU_ACCOUNT_ID}"
  market: "HK"
  trd_env: "SIMULATE"  # REAL also needs --mode live and TRADER_LIVE_CONFIRM=1
  symbols: ["HK.00700"]
  order_type: "LIMIT"
  max_position_notional_hkd: 75000
  max_portfolio_notional_hkd: 750000
  max_daily_loss_hkd: 15000
  max_open_orders: 15
  concentration_limit_pct: 0.25
  signal_cooldown_s: 45
risk:
  max_order_qty: 2000
  max_order_notional: 50000
  max_orders_per_second: 2
  max_orders_per_30s: 12  # Futu allows ~15 place_order per 30 s
  price_band_pct: 0.02
  allow_short: false
  kill_switch_file: "run/KILL"
  cancel_on_exit: true
model:
  type: "mean_reversion"
  path: "data/models/model.pkl"
  hot_reload: false
  confidence_threshold: 0.60
pipeline:
  data_window_size: 120
  feature_interval: "5m"
  queue_maxsize: 1000
logging:
  level: "info"
  format: "json"
  file: "logs/trader.log"
  rotate_bytes: 104857600
metrics:
  prometheus_port: 9090
