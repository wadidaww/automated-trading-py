opend:
  host: "127.0.0.1"
  port: 11111
  heartbeat_interval_s: 10
  reconnect_max_attempts: 5
  rate_limit_requests: 300
  rate_limit_window_s: 30
trading:
  account_id: "${FUTU_ACCOUNT_ID}"
  market: "HK"
  trd_env: "SIMULATE"  # REAL also needs --mode live and TRADER_LIVE_CONFIRM=1
  symbols: ["HK.00700"]
  order_type: "LIMIT"
  max_position_notional_hkd: 75000
  max_portfolio_notional_hkd: 750000
  max_daily_loss_hkd: 15000
  max_open_orders: 15
  concentration_limit_pct: 0.25
  signal_cooldown_s: 45
risk:
  max_order_qty: 1000
  max_order_notional: 25000
  max_orders_per_second: 1
  max_orders_per_30s: 8  # Futu allows ~15 place_order per 30 s
  price_band_pct: 0.01
  allow_short: false
  kill_switch_file: "run/KILL"
  cancel_on_exit: true
  vol_target:  # sizing for target-position models (model.type: trend); off by default
    enabled: false
    target_vol_annual: 0.60
    symbol_weight: 0.10  # largest share of the portfolio per symbol; must be <= concentration_limit_pct
    rebalance_band: 0.10
model:
  type: "mean_reversion"
  path: "data/models/model.pkl"
  hot_reload: false
  confidence_threshold: 0.60
  trend:  # only read by model.type: trend; lookbacks in bars (HK daily: [63, 126, 252], bars_per_year 252)
    lookbacks: [91, 182, 365]
    donchian_entry: 55
    donchian_exit: 20
    vol_window: 20
    bars_per_year: 365
pipeline:
  data_window_size: 120
  feature_interval: "5m"
  queue_maxsize: 1000
logging:
  level: "info"
  format: "json"
  file: "logs/trader.log"
  rotate_bytes: 104857600
metrics:
  prometheus_port: 9090
