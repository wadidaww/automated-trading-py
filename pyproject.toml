[tool.poetry]
name = "futu-quant-trader"
version = "0.1.0"
description = "Production algorithmic trading system for Futu/Futubull"
authors = ["wadidaww <wadidaww@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "futu_trader", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
futu-api = "^9.0"
pandas = "^2.2"
numpy = "^1.26"
polars = "^0.20"
scikit-learn = "^1.4"
torch = "^2.2"
optuna = "^3.6"
onnxruntime = "^1.17"
skl2onnx = "^1.16"
pydantic = "^2.7"
pydantic-settings = "^2.2"
structlog = "^24.1"
aiohttp = "^3.9"
httpx = "^0.27"
apscheduler = "^3.10"
prometheus-client = "^0.20"
watchfiles = "^0.21"
pandas-ta = "^0.3"
plotly = "^5.20"
aiosqlite = "^0.20"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
freezegun = "^1.4"
mypy = "^1.9"
ruff = "^0.4"
pre-commit = "^3.7"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "PT", "SIM", "TCH"]
ignore = ["ANN001", "ANN401", "N803", "N806", "S101", "S311", "TC001", "TC002", "TC003"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
