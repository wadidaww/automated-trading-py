[tool.poetry]
name = "futu-quant-trader"
version = "0.1.0"
description = "Production algorithmic trading system for Futu/Futubull"
authors = ["wadidaww <wadidaww@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "trader", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
futu-api = "^9.0"
pandas = "^2.2"
numpy = "^1.26"
polars = "^0.20"
scikit-learn = "^1.4"
torch = "^2.2"
optuna = "^3.6"
onnxruntime = "^1.17"
skl2onnx = "^1.16"
pydantic = "^2.7"
pydantic-settings = "^2.2"
structlog = "^24.1"
aiohttp = "^3.9"
httpx = "^0.27"
apscheduler = "^3.10"
prometheus-client = "^0.20"
watchfiles = "^0.21"
plotly = "^5.20"
aiosqlite = "^0.20"
pyyaml = "^6.0"
lightgbm = "^4.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
freezegun = "^1.4"
mypy = "^1.9"
ruff = "^0.4"
pre-commit = "^3.7"
types-pyyaml = "^6.0.12.20250516"
import-linter = "^2.1"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/samples", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "PT", "SIM", "TCH"]
ignore = [
    "ANN001",
    "ANN101",
    "ANN102",
    "ANN401",
    "I001",
    "N803",
    "N806",
    "PT001",
    "PT023",
    "S101",
    "S311",
    "TCH001",
    "TCH002",
    "TCH003",
]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
exclude = ["src/samples/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

# Architecture contracts, checked in CI with `lint-imports` (see docs/architecture.md).
[tool.importlinter]
root_package = "trader"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is the dependency-free domain"
type = "forbidden"
source_modules = ["trader.core"]
forbidden_modules = [
    "trader.adapters", "trader.app", "trader.config", "trader.data", "trader.evaluation",
    "trader.execution", "trader.jobs", "trader.marketdata", "trader.model", "trader.patterns",
    "trader.pipeline", "trader.ports", "trader.research", "trader.risk", "futu", "pandas",
    "pydantic",
]

[[tool.importlinter.contracts]]
name = "only the app layer wires adapters"
type = "forbidden"
source_modules = [
    "trader.core", "trader.ports", "trader.risk", "trader.execution", "trader.pipeline",
    "trader.marketdata", "trader.jobs", "trader.model", "trader.data", "trader.evaluation",
]
forbidden_modules = ["trader.adapters", "trader.app"]

[[tool.importlinter.contracts]]
name = "ports do not depend on Futu"
type = "forbidden"
source_modules = ["trader.ports"]
forbidden_modules = ["futu"]

[[tool.importlinter.contracts]]
name = "the live path never imports research code"
type = "forbidden"
source_modules = [
    "trader.app", "trader.pipeline", "trader.risk", "trader.execution", "trader.marketdata",
    "trader.ports", "trader.adapters",
]
forbidden_modules = ["trader.research"]
